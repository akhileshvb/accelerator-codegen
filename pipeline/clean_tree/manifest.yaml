  # so it never ships inside a clean tree where agents would read those names
  - pipeline/clean_tree/manifest.yaml
  - pipeline/clean_tree/manifest.py
  - pipeline/clean_tree/check_leakage.py
  - pipeline/clean_tree/leakage_allowlist.yaml
  - pipeline/clean_tree/leakage_baseline.json
  - pipeline/orchestrator/tests/test_clean_tree.py
  # results data and caches
  - eval/**/results/**
  - eval/**/results_*/**
  - eval/**/results_*.log
  - eval/compare/results/**
  - eval/bench/postgres/baselines/**
  - eval/bench/q1_verus_results/**
  - pipeline/artifacts/**
  - pipeline/.codex/**
  - build-release
  # perf tooling (experiments over the generated accelerators, not a pipeline input)
  - scripts/run_q20_phased_sf20_baselines.sh
  - scripts/run_q20_phased_bench.sh
  - scripts/run_sf1_scale_audit.sh
  - scripts/run_sf10_tpch_bench.sh
  - scripts/run_scale_proxy_suite.sh
  - scripts/run_parallel_scaling_matrix.sh
  - scripts/run_parallel_22q_matrix.sh
