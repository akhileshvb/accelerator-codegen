# The clean tree: what a from-scratch regeneration starts from.
#
#   keep       frozen substrate, plus the scaffolding the pipelines take as input
#   generated  pipeline outputs; absent from the clean tree
#   drop       results data and caches; absent from the clean tree and not regenerated
#
# Globs are repo-relative: `*` stays inside one path segment, `**` crosses
# segments, a trailing `/` means the whole directory. A file matching several
# classes takes the strongest: drop, then generated, then keep. Every tracked
# file must match at least one (pipeline/orchestrator/tests/test_clean_tree.py).
#
# Engine-specific vs engine-neutral is decided by content: a file that includes
# backends/ headers, drives an engine's server or plugin, or exercises a
# per-query accelerator belongs to the engine or accelerator that it serves.
# `skeleton/` is overlaid on the clean tree after the prune: the empty starting
# point of the trees the pipelines grow (accelerators/prims, accelerators/prooflib).

skeleton: pipeline/clean_tree/skeleton

keep:
  - substrate/**
  - cmake/**
  - CMakeLists.txt
  - README.md
  - .gitignore
  - .env.example
  - docs/**
  - workloads/**
  - pipeline/**
  # engine-neutral eval: substrate unit tests, test-database builders, shared test support
  - eval/tests/test_aux_runtime.cpp
  - eval/tests/tsan_module_driver.cpp
  - eval/tests/tpch_param_templates.hpp
  - eval/harness/tpch_test_recipes.hpp
  - eval/tests/test_aux_runtime_units.cpp
  - eval/tests/test_aux_wire.cpp
  - eval/tests/test_core_helpers.cpp
  - eval/tests/test_float_order_ties.cpp
  - eval/tests/test_scratch_dir.cpp
  - eval/tests/test_versioned_aux_store_caps.cpp
  - eval/tests/make_sec_edgar_test_db.cpp
  - eval/tests/make_tpch_test_db.cpp
  - eval/tests/tpch_fuzz_writes.hpp
  - eval/tests/test_support/db_paths.hpp
  - eval/tests/test_support/result_compare.hpp
  - eval/tests/test_support/benchmark_paired_timing.hpp
  - eval/tests/test_support/interference_calibration.hpp
  - eval/tests/test_support/toy_build_state.hpp
  - eval/harness/float_order_ties.hpp
  - eval/harness/slot_gates.*
  # engine-neutral eval drivers: result plotting, comparison drivers, benchmark data and parameters
  - eval/compare/*.py
  - eval/compare/*.sh
  - eval/bench/comparison/**
  - eval/bench/driver/**
  - eval/bench/sec_edgar/**
  - eval/bench/tpch/*.py
  - eval/bench/tpch/*.jsonl
  # scripts: dataset setup, Verus builds, plotting and summaries, static checkers, drivers
  - scripts/**

generated:
