  - backends/**
  # per-query accelerators and their benchmark-level shared code; also prims/ and prooflib/, which are
  # grown from the skeleton by primitive_publish / prooflib_publish
  - accelerators/*/**
  - pipeline/verus/prooflib_provenance.jsonl
  - pipeline/verus/spec_audits.jsonl
  - pipeline/verus/playbook/**
  # engine harnesses and per-query accelerator tests, benchmarks and tools (they link backends/ or accelerators/)
  - eval/harness/*.cmake
  - eval/harness/cost_calibration.*
  - eval/harness/differential.*
  - eval/harness/tpch_rf.*
  - eval/tests/mysql/**
  - eval/tests/postgres/**
  - eval/tests/parallel/**
  - eval/tests/verus_kit/**
  - eval/tests/test_*mysql*
  - eval/tests/test_*postgres*
  - eval/tests/test_aux_calibration.cpp
  - eval/tests/test_aux_multi_connection_stress.cpp
  - eval/tests/test_aux_read_own_writes.cpp
  - eval/tests/test_aux_snapshot_reads.cpp
  - eval/tests/test_cross_accel_*.cpp
  - eval/tests/test_fallback_state_agree.cpp
  - eval/tests/test_partitioned_build.cpp
  - eval/tests/test_registration.cpp
  - eval/tests/test_shared_incremental_differential.cpp
  - eval/tests/test_shared_tpch_rf_differential.cpp
  - eval/tests/test_slot_gates_duckdb.cpp
  - eval/tests/test_tpch_*.cpp
  - eval/tests/maintenance_choice_demo.cpp
  - eval/tests/test_support/cross_accel_helpers.*
  - eval/tests/test_support/module_runtime.hpp
  - eval/tests/test_support/multi_connection_stress.cpp
  - eval/tools/**
  - eval/compare/*.cpp
  - eval/compare/mv_defs.py
  - eval/compare/pg_cost_models.py
  - eval/compare/run_sql_backend.py
  - eval/bench/aux_state/*.cpp
  - eval/bench/mysql/**
  - eval/bench/postgres/*.cpp
  - eval/bench/sec_edgar/pg_mt_base.py
  - eval/bench/sec_edgar/pg_tune_base.py
  - eval/bench/sec_edgar/sweep/**
  - eval/bench/tpch/single-threaded/**
  - eval/bench/tpch/parallel/**
  - eval/bench/tpch/stateless_matrix.cpp
  # slot adapters are backend-owned; the README stays
  - pipeline/gates/slot_adapters/*.sh
  # engine-specific scripts: PostgreSQL / MySQL builds, servers, loaders, SQL, baselines, sweeps
  - scripts/build_accel_mysql_plugin.sh
  - scripts/build_accel_postgres_extension.sh
  - scripts/build_base_pg.sh
  - scripts/ensure_*.sh
  - scripts/finish_sf3000_pg_setup.sh
  - scripts/gen_mysql_capture_triggers.py
  - scripts/generate_tpch_immvs.py
  - scripts/generate_tpch_matviews.py
  - scripts/load_tpch_*_mysql.py
  - scripts/load_tpch_*_postgres.py
  - scripts/mysql_*
  - scripts/pg_base_bench.py
  - scripts/postgres_*
  - scripts/run_base_postgres.sh
  - scripts/run_mysql_*
  - scripts/run_postgres_*
  - scripts/run_tpch_pg_*
  - scripts/setup_accel_*
  - scripts/setup_sf20_sql_backends.sh
  - scripts/setup_tpch_sf20_postgres.sh
