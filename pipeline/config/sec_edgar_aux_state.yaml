# SEC EDGAR aux-state overrides merged when benchmark_name=sec_edgar and workload_kind=aux_state.

write_paths:
  - CMakeLists.txt
  - cmake/AuxState.cmake
  # the query's own tree: module, layout, registrars (engine backends name no query)
  - accelerators/sec_edgar/q*/**
  - eval/tests/test_support/cross_accel_helpers.cpp
  - eval/tests/test_support/cross_accel_helpers.hpp

allowed_commands:
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest -R (sec_edgar_q\\d+_|test_sec_edgar_q\\d+_|test_cross_accel|test_aux_multi_connection).*"
  - "^ctest --test-dir build-release( .*)?$"
  - "^ctest -N( .*)?$"
  # test / bench / calibrate binaries land in the build root (no tests/ or benchmarks/ subdir)
  - "^(\\./)?build-release/(test|benchmark|calibrate)_[A-Za-z0-9_]+( .*)?$"
  - "^bash scripts/run_aux_bench_sweep\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cross_accel\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_multi_connection\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_tsan\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cost_model_calibrate\\.sh \\d+$"

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: filing_append
  bench_warmup: 10
  bench_queries: 100
  bench_ref_samples: 5
  bench_base_write_samples: 3
