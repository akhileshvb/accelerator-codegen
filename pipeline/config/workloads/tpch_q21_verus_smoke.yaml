# Smoke workload of the Verus pipeline (--mode verus is its default) on TPC-H
# Q21: small benches and a short optimization loop, for checking the pipeline
# itself (e.g. with ACCEL_VERUS_REPLAY).  Real runs use tpch_q21_aux --mode verus.
workload_kind: aux_state
benchmark_name: tpch
query_number: 21
engines: [duckdb]
mode: verus
reference_sql_path: workloads/tpch/instances/seed_1/21.sql
parameters:
  - name: nation_name
    type: VARCHAR
verus:
  build_dir: build-verus-duckdb
  optimization:
    stage_budget_sec: 3600
    patience: 2
    min_attempts: 2
    hotspot_share: 0.5
    bench:
      reps: 3
      ops: 40
  gates:
    snapshot_writes: 100
