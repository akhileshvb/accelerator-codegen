workload_kind: aux_state
benchmark_name: sec_edgar
query_number: 24
engines: [duckdb]
query_id: "24"
accelerator_id: sec_edgar_q24_aux
base_function_name: accel_sec_edgar_q24
aux_function_name: accel_sec_edgar_q24_aux

requires_base_accelerator: true
prerequisite_workload: sec_edgar_q24
prerequisite_min_stage: implementation
reference_accelerators: []

allow_poor_fitness: false
allow_unsuccessful_design: false

reference_sql_path: workloads/sec_edgar/q24.sql

parameters:   # spec: eval/bench/sec_edgar/params/q24.json (zero-arg function = defaults)
  - {name: year, type: BIGINT, default: 2023, domain: [2019, 2020, 2021, 2022, 2023, 2024]}
  - {name: uom, type: VARCHAR, default: "USD", domain: ["USD", "shares", "pure", "CAD", "CNY", "EUR"]}

dependent_tables:
  - name: num
    watched_columns: [adsh, tag, version, uom, value, ddate, qtrs, coreg, footnote]
  - name: pre
    watched_columns: [adsh, tag, version, stmt, plabel]

partitioning: {}

output_schema:
  - {name: tag, type: VARCHAR}
  - {name: version, type: VARCHAR}
  - {name: cnt, type: BIGINT}
  - {name: total, type: DOUBLE}


speedup_verification:
  min_speedup_vs_base: 2.0
  min_work_reduction_pct: 50

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: value_append
  bench_warmup: 10
  bench_queries: 100
  bench_base_write_samples: 3

cmake:
  benchmark: sec_edgar
  query_num: 24
  aux_state_module: accel_add_aux_state_query

agent_boundary: prompts/aux_state/shared/agent_boundary.md
