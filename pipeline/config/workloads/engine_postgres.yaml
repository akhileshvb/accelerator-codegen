workload_kind: engine_backend
engine_name: postgres
artifact_namespace: engines/postgres
display_name: Postgres
prompt_subdir: engine_backend
query_number: 0

engine_sdk_hints:
  - "Postgres extension build flag ACCELERATOR_CODEGEN_BUILD_POSTGRES"
  - "include/accelerator_codegen/runtime/native_scan.hpp"

optional_example_backends:
  - duckdb

store_mode_candidates:
  - serialized_boundary

target_paths:
  scan_adapter_header: include/accelerator_codegen/runtime/postgres/scan_adapter.hpp
  scan_adapter_source: src/runtime/postgres/scan_adapter.cpp
  stateful_dir: include/accelerator_codegen/stateful/postgres
  stateful_src_dir: src/stateful/postgres

cmake:
  collect_fn: accel_collect_postgres_stateful_sources
  build_flag: ACCELERATOR_CODEGEN_BUILD_POSTGRES

post_implementation_gates:
  - engine_build
post_validation_gates:
  - engine_build
  - engine_scan_conformance

allow_update_existing: true
