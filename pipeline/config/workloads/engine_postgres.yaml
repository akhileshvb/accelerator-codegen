workload_kind: engine_backend
engine_name: postgres
display_name: Postgres

engine_sdk_hints:
  - "Postgres extension build flag ACCELERATOR_CODEGEN_BUILD_POSTGRES"
  - "include/accelerator_codegen/runtime/native_scan.hpp"

# Existing tree uses conventional scan_adapter paths under runtime/postgres.
store_mode_candidates:
  - serialized_boundary

cmake:
  collect_fn: accel_collect_postgres_stateful_sources
  build_flag: ACCELERATOR_CODEGEN_BUILD_POSTGRES

allow_update_existing: true
