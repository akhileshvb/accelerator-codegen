# From-scratch Postgres adapter onboarding.
# Conventional paths/write_paths/cmake names come from pipeline/config/engine_backend.yaml.
# Engine-specific SDK detail lives HERE only; shared prompts/gates stay engine-agnostic.
#
# Do not describe a prior in-repo adapter. The agent implements against the
# substrate + PostgreSQL 17 server headers + these connection hints.

workload_kind: engine_backend
engine_name: postgres
display_name: Postgres
allow_update_existing: false

hide_foreign_engines: true
agent_hidden_trees:
  - include/accelerator_codegen/runtime/duckdb
  - src/runtime/duckdb
  - include/accelerator_codegen/stateful/duckdb
  - src/stateful/duckdb
  - src/generated/catalog/duckdb
  - src/generated/tpch
  - src/generated/sec_edgar

# Server-extension packaging: host layer is required.
requires_in_process_host: true

host_runtime:
  kind: docker
  discovery: postgres_docker
  ensure_script: scripts/ensure_accel_pg_test.sh
  build_script: scripts/build_accel_postgres_extension.sh
  ninja_targets_env: ACCEL_PG_NINJA_TARGETS
  container_env: ACCEL_PG_CONTAINER
  default_container: accel_pg_test
  binary_dir: /accel-build/accel
  env:
    ACCEL_PG_DOCKER: "1"
    # From-scratch: start the container only. Layer gates build via build_script;
    # do not fail closed on missing live adapter sources / a stale MODULE .so.
    ACCEL_PG_ENSURE_BUILD: "0"

engine_sdk_hints:
  - "Postgres for this pipeline is Docker container `accel_pg_test` (postgres:17). Start with `ACCEL_PG_ENSURE_BUILD=0 bash scripts/ensure_accel_pg_test.sh` (container only until the host MODULE exists). Do not install a host pacman/$HOME/opt server SDK."
  - "Edit sources on the host (mounted in the container at `/accel-src`). Rebuild with `bash scripts/build_accel_postgres_extension.sh` (cmake/ninja inside the container)."
  - "Connect from host: PGHOST=127.0.0.1 PGPORT=5434. Inside the container / docker exec: PGHOST=127.0.0.1 PGPORT=5432. Env: ACCEL_PG_DOCKER=1."
  - "In-process MODULE target name: `accelerator_codegen_pg`. Installed .so path in the container: `/usr/lib/postgresql/17/lib/accelerator_codegen_pg.so`."
  - "Use PostgreSQL 17 server headers (SPI, table/heap AM, triggers, xact callbacks, `_PG_init`) from the in-container SDK. Server-only symbols belong only in the MODULE — never in a host shared library that standalone harnesses link."
  - "Shared substrate (do not regenerate): include/accelerator_codegen/stateful/{core,state,maintenance}/ — MutationBatch, AuxStateStore, AuxEngineServices, coordinator."
  - "Do not read or copy another engine's runtime|stateful tree. Do not depend on generated TPC-H/SEC query modules."

store_mode_candidates:
  - typed_in_process
  - serialized_boundary
