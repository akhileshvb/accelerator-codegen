workload_kind: aux_state
benchmark_name: sec_edgar
query_number: 3
engines: [duckdb]
reference_sql_path: workloads/sec_edgar/q3.sql
parameters:   # spec: eval/bench/sec_edgar/params/q3.json (zero-arg function = defaults)
  - {name: fy, type: BIGINT, default: 2022, domain: [2021, 2022, 2023, 2024]}
  - {name: uom, type: VARCHAR, default: "USD", domain: ["USD", "shares", "pure", "CAD", "CNY", "EUR"]}

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: value_append
  bench_warmup: 10
  bench_queries: 100
  bench_base_write_samples: 3
