workload_kind: aux_state
benchmark_name: sec_edgar
query_number: 3
engine_name: duckdb
query_id: "3"
accelerator_id: sec_edgar_q3_aux
base_function_name: accel_sec_edgar_q3
aux_function_name: accel_sec_edgar_q3_aux

requires_base_accelerator: true
prerequisite_workload: sec_edgar_q3
prerequisite_min_stage: implementation
reference_accelerators: []

allow_poor_fitness: false
allow_unsuccessful_design: false

reference_sql_path: eval/bench/sec_edgar/queries/q3.sql

parameters:   # spec: eval/bench/sec_edgar/params/q3.json (zero-arg function = defaults)
  - {name: fy, type: BIGINT, default: 2022, domain: [2021, 2022, 2023, 2024]}
  - {name: uom, type: VARCHAR, default: "USD", domain: ["USD", "shares", "pure", "CAD", "CNY", "EUR"]}

dependent_tables:
  - name: num
    watched_columns: [adsh, tag, version, uom, value, ddate, qtrs, coreg, footnote]
  - name: sub
    watched_columns: [adsh, name, cik, fy, sic, form, filed, period]

partitioning: {}

output_schema:
  - {name: name, type: VARCHAR}
  - {name: cik, type: INTEGER}
  - {name: total_value, type: DOUBLE}

cost_model_config: accelerators/sec_edgar/q3/config/sec_edgar_q3_aux_cost_model.json

speedup_verification:
  min_speedup_vs_base: 2.0
  min_work_reduction_pct: 50

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: value_append
  bench_warmup: 10
  bench_queries: 100
  bench_base_write_samples: 3

cmake:
  benchmark: sec_edgar
  query_num: 3
  aux_state_module: accel_add_aux_state_query

agent_boundary: prompts/aux_state/shared/agent_boundary.md
