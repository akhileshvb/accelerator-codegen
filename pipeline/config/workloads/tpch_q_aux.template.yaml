# Template for TPC-H aux-state workloads. Copy to tpch_q{N}_aux.yaml and fill in.

workload_kind: aux_state
benchmark_name: tpch
query_number: 0          # set to query number
query_id: "0"
accelerator_id: tpch_q0_aux
base_function_name: accel_tpch_q0
aux_function_name: accel_tpch_q0_aux

requires_base_accelerator: true
prerequisite_workload: tpch_q0
prerequisite_min_stage: implementation

reference_accelerators: []   # optional; omit for blank-slate runs
allow_poor_fitness: false
allow_unsuccessful_design: false

reference_sql_path: ""       # path to generated SQL instance
seed_manifest_root: ""       # path to seed manifest root

parameters: []
dependent_tables: []
partitioning: {}

output_schema: []

cost_model_config: config/q0_aux_cost_model.json

speedup_verification:
  min_speedup_vs_base: 2.0
  min_work_reduction_pct: 50

cmake:
  query_num: 0
  aux_state_module: accel_add_aux_state_query

agent_boundary: prompts/aux_state/shared/agent_boundary.md
