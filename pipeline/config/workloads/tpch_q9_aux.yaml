workload_kind: aux_state
benchmark_name: tpch
query_number: 9
engines: [duckdb, postgres, mysql]
reference_sql_path: workloads/tpch/instances/seed_1/09.sql
parameters:
  - name: color
    type: VARCHAR

optimization_guidance: |
  Q9 is **multi-way join + grouped aggregation** with a string bind param:
  - Filter: `p_name LIKE '%color%'` (color parameter).
  - Join: part → lineitem → partsupp → supplier → orders → nation.
  - Per-row profit: `l_extendedprice * (1 - l_discount) - ps_supplycost * l_quantity`.
  - Output: `GROUP BY nation, o_year` with `SUM(amount)`.

  Structural read-path priorities:
  1. **Pre-filter parts by color** at build time — avoid scanning all parts on every read.
  2. **Materialize (nation, o_year) profit aggregates** or dense partial sums — avoid repeating the 6-way join.
  3. **Chunked lineitem/partsupp state** keyed by partkey or (partkey, suppkey) for scalable maintenance.

  Full redesign is allowed (module.hpp + module.cpp + finalize.cpp + tests + cost model).
  Sources are bootstrapped; retrieved precedents are non-binding. End with `HYPOTHESIS_PATCH_COMPLETE`.
