workload_kind: aux_state
benchmark_name: tpch
query_number: 15
engines: [duckdb, postgres, mysql]
reference_sql_path: workloads/tpch/instances/seed_1/15.sql
parameters:
  - name: start_date
    type: DATE

optimization_guidance: |
  Q15 finds suppliers with MAX quarterly revenue (3-month shipdate window from start_date).
  Maintain per-supplier revenue in the window (or top-k / max tracker); supplier attr
  join is small once winners are known.
