dependent_tables:
  - name: lineitem
    watched_columns: [l_partkey, l_quantity, l_extendedprice]
  - name: part
    watched_columns: [p_partkey, p_brand, p_container]

partitioning: {}   # analysis stage will propose grain (e.g. partkey bands, brand+container)

output_schema:
  - name: avg_yearly
    type: DECIMAL

cost_model_config: config/q17_aux_cost_model.json

optimization_guidance: |
  Q17 is **part-grain aggregation + selective filter**:
  - Subquery: per-`l_partkey`, `0.2 * AVG(l_quantity)` over all lineitems.
  - Read path: join qualifying parts (brand + container) to lineitems where `l_quantity < avg_quantity`,
    then `SUM(l_extendedprice) / 7.0`.

  Structural read-path priorities:
  1. **Materialize per-part quantity thresholds** at build time — avoid rescanning all lineitems for the aggregate.
  2. **Brand+container part index** — iterate matching parts only, not full part scan + filter.
  3. **Colocate extendedprice sums** with threshold flags for qualifying lineitems.

  Full redesign is allowed (module.hpp + module.cpp + finalize.cpp + tests + cost model).
  Sources are bootstrapped; use `rip_grep` / `ast_grep` on reference aux modules. End with `HYPOTHESIS_PATCH_COMPLETE`.

