workload_kind: engine_backend
engine_name: mysql
artifact_namespace: engines/mysql
display_name: MySQL
prompt_subdir: engine_backend
query_number: 0

# Host SDK / docs the analysis agent should consult (paths relative to repo or absolute).
engine_sdk_hints:
  - "Supply MySQL server source / handler API docs externally when available."

# Optional few-shot example snippets (not required on disk for success).
optional_example_backends:
  - duckdb
  - postgres

store_mode_candidates:
  - typed_in_process
  - serialized_boundary

target_paths:
  scan_adapter_header: include/accelerator_codegen/runtime/mysql/scan_adapter.hpp
  scan_adapter_source: src/runtime/mysql/scan_adapter.cpp
  stateful_dir: include/accelerator_codegen/stateful/mysql
  stateful_src_dir: src/stateful/mysql

cmake:
  collect_fn: accel_collect_mysql_sources
  build_flag: ACCELERATOR_CODEGEN_BUILD_MYSQL

post_implementation_gates:
  - engine_build
post_validation_gates:
  - engine_build
  - engine_scan_conformance

allow_update_existing: true
