# Copy to engine_<name>.yaml and set engine_name (plus optional SDK hints).
# target_paths / cmake / write_paths / implementation_layers are filled from
# pipeline/config/engine_backend.yaml unless overridden.
#
# From-scratch: do not assume any other engine adapter exists. Substrate +
# templates + these SDK hints only.
#
# Outcome: the engine's slot implementations (S1-S8), built in the sequential
# layers of prompts/engine_backend/layers.md, each with
# backends/<engine>/tests/test_<engine>_<layer>.cpp. Validation adds unseen
# adversarial tests and the backend-generic slot gates (gates/run_slot_gates.sh;
# add gates/slot_adapters/<engine>.sh for a new engine).
#
# placement_candidates (S6): in_process | shipped_worker

workload_kind: engine_backend
engine_name: REPLACE_ME

engine_sdk_hints:
  - "Paths or docs for this engine's native storage / table / handler APIs"

# Optional docker/in-process host. Omit for embedded engines that build on the host.
# host_runtime:
#   kind: docker          # or host_cmake
#   discovery:            # optional plugin name (postgres_docker, mysql_docker)
#   ensure_script: scripts/ensure_<engine>_host.sh
#   build_script: scripts/build_<engine>_extension.sh
#   ninja_targets_env: ACCEL_NINJA_TARGETS
#   default_container: accel_<engine>_test
#   binary_dir: /accel-build/accel

# requires_in_process_host: true

allow_update_existing: false
