workload_kind: aux_state
benchmark_name: sec_edgar
query_number: 4
engines: [duckdb]
reference_sql_path: workloads/sec_edgar/q4.sql
query_sql_path: workloads/sec_edgar/parameterized/q4.sql   # $n form of the query: test suites bind tuples to it
parameters:   # spec: eval/bench/sec_edgar/params/q4.json (zero-arg function = defaults)
  - {name: sic_lo, type: INTEGER, default: 4000, domain: "see joint_domain in the json spec"}
  - {name: sic_hi, type: INTEGER, default: 4999, domain: "see joint_domain in the json spec"}
  - {name: stmt, type: VARCHAR, default: "EQ", domain: ["BS", "IS", "CF", "EQ", "CI"]}
  - {name: uom, type: VARCHAR, default: "USD", domain: ["USD", "shares", "pure", "CAD", "CNY", "EUR"]}

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: value_append
  bench_warmup: 10
  bench_queries: 100
  bench_base_write_samples: 3
