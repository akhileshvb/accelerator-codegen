# The pipeline's settings. Every setting and its default is a field in accel_pipeline/config.py;
# this file sets only what differs from the defaults.

sandbox_extra_ro: []

# Dataset databases are run parameters: each key names the environment variable that holds the
# database path (unset: the dataset is unavailable to the run).
datasets:
  tpch_sf1: ACCEL_TPCH_DB
  tpch_sf10: ACCEL_TPCH_SF10_DB
  tpch_test: ACCEL_TPCH_TEST_DB
  sec_edgar_sf3: ACCEL_SEC_EDGAR_DB
  kestrel_sf1: ACCEL_KESTREL_DB

# backends/<engine>/bench/: benchmark_<engine>_<bench>_aux, calibrate_<engine>_<bench>_aux_cost_model
shared_bench_harness: [tpch]

optimization:
  max_attempts_per_iteration: 5
  quick_benchmark_samples: 1
  # OPTIMIZATION_SATURATED below the read-speedup floor needs profile-guided, distinct attempts.
  early_stop:
    enabled: true
    saturation_min_read_speedup: 20
    saturation_required_attempts: 8

# Turn caps per stage; 0 = unlimited. aux_state.yaml overrides them for aux workloads.
stage_max_turns:
  analysis: 8
  implementation: 15
  optimization: 0
  crash_debug: 12
  audit: 6
  host_bootstrap: 0

write_paths:
  # a query owns its whole directory: kernels, tests, benchmarks, cost models
  - accelerators/*/q*/**
  - accelerators/sec_edgar/q*/**
  - eval/tests/test_support/**
  - pipeline/artifacts/**

allowed_commands:
  # pwd, ls, test -f (repo navigation) are always allowed via shell_tools built-ins
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest -R [a-z0-9_]*q\\d+.*$"
  - "^ctest --test-dir build-release( .*)?$"
  - "^ctest -N( .*)?$"
  - "^ninja -C build-release.*$"

repair:
  never_quarantine: [aux_correctness, aux_correctness_iterate, aux_unit, test_suite_validate]   # a suite that cannot be validated stops the stage; it is never frozen unvalidated

session:
  stage_soft_deadline_sec: {test_suite: 900, analysis: 900}
  max_resumes: 0   # one conversation per role, like a single agent session
  # A stage's own acceptance gate passing during the agent's turn ends the turn (the stage then runs the gate again and completes).
  exit_gate: {test_suite: test_suite_validate}

test_suite:
  write_mix:   # the range the tester starts from (write_mix.yaml of the suite is the query's own)
    frequency_pct: {min: 1, max: 50, samples: 3, distribution: log}
