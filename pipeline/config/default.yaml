repo_root: /home/akhilvb/accelerator-codegen
duckdb_root: /home/akhilvb/accelerator-codegen-duckdb
build_dir: build-release
tpch_db_sf1: /home/akhilvb/accelerator-codegen-duckdb/tpch_sf1.duckdb
tpch_db_sf10: /home/akhilvb/accelerator-codegen-duckdb/tpch_sf10.duckdb

datasets:
  tpch_sf1: /home/akhilvb/accelerator-codegen-duckdb/tpch_sf1.duckdb
  tpch_sf10: /home/akhilvb/accelerator-codegen-duckdb/tpch_sf10.duckdb
  sec_edgar_sf3: /home/akhilvb/accelerator-codegen-duckdb/sec_edgar_sf3.duckdb

optimization:
  max_iterations: 5
  no_improvement_stop: 4
  episodes_per_iteration: 4
  max_turns_per_episode: 8

crash_debug:
  # 0 = keep crash-debugging within the same stage/iter until mandatory gates pass
  max_rounds: 0
  safety_cap: 25

stage_max_turns:
  analysis: 8
  implementation: 15
  optimization: 20
  crash_debug: 12
  audit: 6

write_paths:
  - include/accelerator_codegen/tpch_q*
  - src/generated/tpch/q*
  - tests/single-threaded/test_tpch_q*
  - tests/test_support/q*
  - benchmarks/tpch/single-threaded/benchmark_q*
  - pipeline/artifacts/**

allowed_commands:
  - "^cmake --build build-release( .*)?$"
  - "^ctest -R tpch_q\\d+.*$"
  - "^ninja -C build-release.*$"

gates_dir: pipeline/gates
