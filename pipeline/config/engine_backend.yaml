# Shared engine_backend pipeline settings merged when workload_kind=engine_backend.
# Paths may use {engine} (sanitized engine_name). Do not hardcode a host engine here.

write_paths:
  # one glob owns the whole backend: backend.cmake state/ engine/ api/ tests/ bench/
  - backends/{engine}/**
  - pipeline/artifacts/engines/{engine}/**

allowed_commands:
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest --test-dir build-release( .*)?$"
  - "^(\\.\\/)?build-release\\/test_[a-z0-9_]+( .*)?$"
  - "^bash pipeline/gates/run_engine_build\\.sh$"
  - "^bash pipeline/gates/run_engine_layer\\.sh$"
  - "^bash pipeline/gates/run_engine_scan_conformance\\.sh$"
  - "^bash pipeline/gates/run_engine_contract\\.sh$"
  - "^bash pipeline/gates/run_engine_adversarial\\.sh$"
  - "^bash pipeline/gates/run_engine_aux_smoke\\.sh$"
  - "^bash pipeline/gates/run_slot_gates\\.sh$"
  - "^bash pipeline/gates/run_aux_tsan\\.sh slots( .*)?$"
  - "^bash pipeline/gates/run_thread_budget_lint\\.sh( .*)?$"

# A backend run generates slot implementations (S1-S8, substrate/aux/runtime/
# engine_slots.hpp); the runtime flow is substrate and frozen. Sequential
# layers, one agent stage each; the orchestrator iterates until the layer's
# gate passes. Analysis sketches every layer.
implementation_layers:
  - id: capture
    title: Capture (S1)
    gate: engine_capture
    harness: backends/{engine}/tests/test_{engine}_capture.cpp
    cmake_target: test_{engine}_capture
    rules: [slot_capture, commit_time_writes, ddl_events]
  - id: epochs
    title: Commit epoch, reader epoch, version floor (S2-S4)
    gate: engine_epochs
    harness: backends/{engine}/tests/test_{engine}_epochs.cpp
    cmake_target: test_{engine}_epochs
    rules: [slot_epochs, abort_paths]
  - id: scan
    title: Build snapshot and chunked scans (S5, S8)
    gate: engine_scan
    harness: backends/{engine}/tests/test_{engine}_scan.cpp
    cmake_target: test_{engine}_scan
    rules: [slot_scan, native_scan]
  - id: runtime
    title: Placement and toy runtime (S6)
    gate: engine_runtime
    harness: backends/{engine}/tests/test_{engine}_runtime.cpp
    cmake_target: test_{engine}_runtime
    rules: [slot_runtime, own_writes]
  - id: host
    title: Entry points and packaging (S7)
    gate: engine_host
    harness: backends/{engine}/tests/test_{engine}_host.cpp
    cmake_target: test_{engine}_host
    rules: [slot_entry, host_glue]
    skip_unless: requires_in_process_host

# Default post-layer gates (engine_build + this layer). Overridden per stage.
post_implementation_gates:
  - engine_build

# Validation: every layer again, the unseen adversarial tests, then the
# backend-generic slot gates (run_slot_gates.sh, per-engine adapters).
post_validation_gates:
  - engine_build
  - engine_capture
  - engine_epochs
  - engine_scan
  - engine_runtime
  - engine_host
  - engine_adversarial
  - slot_epoch_stress
  - slot_hits_under_writes
  - slot_read_after_commit
  - slot_txn_edges
  - slot_restart
  - slot_own_writes
  - slot_ddl_events
  - slot_tsan
  - slot_differential

prompt_subdir: engine_backend

# Conventional layout used when workload omits target_paths / cmake.
default_target_paths:
  host_header: backends/{engine}/api/{engine}_host.hpp
  host_source: backends/{engine}/api/{engine}_host.cpp
  capture_header: backends/{engine}/engine/capture.hpp
  capture_source: backends/{engine}/engine/capture.cpp
  scan_header: backends/{engine}/engine/scan.hpp
  scan_source: backends/{engine}/engine/scan.cpp
  stateful_dir: backends/{engine}/state
  stateful_src_dir: backends/{engine}/state
  contract_test: backends/{engine}/tests/test_{engine}_runtime.cpp
  contract_test_target: test_{engine}_runtime
  adversarial_test: backends/{engine}/tests/test_{engine}_adversarial.cpp
  adversarial_test_target: test_{engine}_adversarial

# The build convention is cmake/Backend.cmake: the backend's one CMake entry file
# (template: templates/engine_backend/backend.cmake.tpl), which the root
# CMakeLists.txt includes when the profile's build.cmake_option is ON. No shared cmake is edited.
default_cmake:
  entry: backends/{engine}/backend.cmake

# The engine_profile sections (schemas/engine_profile.schema.json) each stage sees. Hazards are
# narrowed to the layer. `all` is every section. Layer ids also key their impl and critique stages.
engine_profile_sections:
  analysis: all
  capture: [identity, process_model, capture, transactions, locking, hazards]
  epochs: [identity, process_model, transactions, locking, capture, hazards]
  scan: [identity, process_model, transactions, locking, scan, thread_knobs, hazards]
  runtime: [identity, packaging, host_runtime, process_model, locking, thread_knobs, scan, hazards]
  host: [identity, packaging, host_runtime, build, process_model, entry_points, thread_knobs, hazards]
  validation: [identity, process_model, capture, transactions, locking, scan, oracle, hazards]
  architecture_audit: [identity, packaging, process_model, capture, transactions, locking, scan, thread_knobs, hazards]

stage_max_turns:
  analysis: 20
  implementation: 0
  architecture_audit: 30
  layer_critique: 20
  validation: 0

allow_update_existing: true

# From-scratch fairness: physically move foreign host adapters out of the workspace.
hide_foreign_engines: true

architecture_audit_max_rounds: 3
# Post-stage engine_build + layer gate: on fail, re-invoke that impl layer with
# notes/log_tail. Count is implementation attempts (including the first). 0 = one
# attempt then fail (no retry). Applies to every impl_* stage.
layer_gate_max_rounds: 3
# Per-layer cheap critic after gates; 0 disables. On fail, re-run that impl layer.
layer_critique_max_rounds: 2
