# Shared engine_backend pipeline settings merged when workload_kind=engine_backend.
# Paths may use {engine} (sanitized engine_name, e.g. mysql, duckdb, postgres).

write_paths:
  - CMakeLists.txt
  - cmake/GeneratedSources.cmake
  - cmake/**
  - include/accelerator_codegen/runtime/{engine}/**
  - src/runtime/{engine}/**
  - include/accelerator_codegen/stateful/{engine}/**
  - src/stateful/{engine}/**
  - src/generated/{engine}/**
  - pipeline/artifacts/engines/{engine}/**
  - pipeline/artifacts/engines/**

allowed_commands:
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest --test-dir build-release( .*)?$"
  - "^bash pipeline/gates/run_engine_build\\.sh$"
  - "^bash pipeline/gates/run_engine_scan_conformance\\.sh$"
  - "^bash pipeline/gates/run_engine_aux_smoke\\.sh$"

post_implementation_gates:
  - engine_build

post_validation_gates:
  - engine_build
  - engine_scan_conformance

prompt_subdir: engine_backend

# Conventional layout used when workload omits target_paths / cmake.
default_target_paths:
  scan_adapter_header: include/accelerator_codegen/runtime/{engine}/scan_adapter.hpp
  scan_adapter_source: src/runtime/{engine}/scan_adapter.cpp
  stateful_dir: include/accelerator_codegen/stateful/{engine}
  stateful_src_dir: src/stateful/{engine}

default_cmake:
  collect_fn: accel_collect_{engine}_sources
  build_flag: ACCELERATOR_CODEGEN_BUILD_{ENGINE}

store_mode_candidates:
  - typed_in_process
  - serialized_boundary

stage_max_turns:
  analysis: 20
  implementation: 0
  validation: 12

allow_update_existing: true
