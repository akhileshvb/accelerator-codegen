# Default: Cursor SDK (bills to your Cursor plan via CURSOR_API_KEY).
# For OpenRouter: --models-config pipeline/config/models.openrouter.yaml
# For Codex exec (impl/opt): --models-config pipeline/config/models.codex.yaml
# Install: pip install -e ".[openrouter]" or ".[codex]"
provider: cursor
api_key_env: CURSOR_API_KEY

presets:
  default: composer-2.5
  fast: composer-2.5
  strong: composer-2.5
  code: composer-2.5

stages:
  analysis: fast
  implementation: strong
  optimization_unified: code
  optimization_worker: code
  optimization_fix: code
  crash_debug: strong
  audit: strong
