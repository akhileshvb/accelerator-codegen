# Default: Cursor SDK (bills to your Cursor plan via CURSOR_API_KEY).
# For OpenRouter: copy config/models.openrouter.yaml to models.yaml, or pass
#   --models-config pipeline/config/models.openrouter.yaml
# Install: pip install -e ".[openrouter]"
provider: cursor
api_key_env: CURSOR_API_KEY

presets:
  default: composer-2.5
  fast: composer-2.5
  strong: composer-2.5
  code: composer-2.5

stages:
  analysis: fast
  implementation: strong
  optimization: default
  optimization_unified: code
  optimization_analysis: strong
  optimization_patch: code
  crash_debug: strong
  audit: strong
