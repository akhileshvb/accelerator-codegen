# Default: Cursor SDK (bills to your Cursor plan via CURSOR_API_KEY).
# Switch to provider: openai for OpenAI Agents SDK, or openrouter once implemented.
provider: cursor
api_key_env: CURSOR_API_KEY

presets:
  default: composer-2.5
  fast: composer-2.5
  strong: composer-2.5
  code: composer-2.5

stages:
  analysis: fast
  implementation: strong
  optimization: default
  audit: strong
