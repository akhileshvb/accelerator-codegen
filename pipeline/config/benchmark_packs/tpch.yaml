benchmark_name: tpch
display_name: TPC-H
artifact_namespace: tpch
source_subdir: tpch/single-threaded
header_prefix: tpch_q
function_prefix: accel_tpch_q
create_fn_prefix: CreateTpchQ
test_target_prefix: test_tpch_q
bench_target_prefix: benchmark_tpch_q
ctest_smoke_suffix: _smoke_test
dataset_key: tpch_sf1
scale_dataset_key: tpch_sf10
db_env_var: ACCEL_TPCH_DB

write_paths:
  - include/accelerator_codegen/tpch_q*
  - src/generated/tpch/**
  - tests/single-threaded/test_tpch_q*
  - tests/test_support/q*_manifest.hpp
  - benchmarks/tpch/**

allowed_commands:
  - "^ctest -R tpch_q\\d+.*$"

post_implementation_gates:
  - correctness
  - baseline
  - profile

post_optimization_gates:
  - correctness
  - baseline
  - sf10
  - profile

post_audit_gates:
  - fairness
  - sf10

fairness:
  cardinality_constants:
    - "150000"
    - "600000"
    - "800000"
  kernel_search_paths:
    - src/generated/tpch/single-threaded/q{N}_kernel.cpp
    - src/generated/tpch/q{N}_kernel.cpp
    - src/generated/tpch/single-threaded/q{N}_fused_scan.cpp
