benchmark_name: tpch
display_name: TPC-H
artifact_namespace: tpch
dataset_key: tpch_sf1
scale_dataset_key: tpch_sf10
db_env_var: ACCEL_TPCH_DB
test_dataset_key: tpch_test
params_generator: eval/compare/gen_tpch_params.py

# The data the accelerator must serve in production, relative to the iteration dataset (dataset_key):
# tables grow `scale`-fold except the `fixed` ones; `writes` is what the application writes.
production:
  scale: 3000
  fixed: [nation, region]
  writes: >-
    Refresh functions: new orders arrive with their lineitems (RF1) and old orders are deleted with
    their lineitems (RF2), each about 0.1% of orders per refresh, keys spread uniformly; part, supplier,
    customer and partsupp change rarely.

write_paths:
  - accelerators/tpch/**
  - eval/tests/test_support/**
  - eval/bench/tpch/**

allowed_commands:
  - "^ctest -R tpch_q\\d+.*$"

post_implementation_gates:
  - correctness
  - baseline
  - profile

post_optimization_gates:
  - correctness
  - baseline
  - sf10
  - profile

post_audit_gates:
  - fairness
  - sf10

fairness:
  cardinality_constants:
    - "150000"
    - "600000"
    - "800000"
  kernel_search_paths:
    - accelerators/{bench}/q{N}/{engine}/base/single-threaded/kernel.cpp
    - accelerators/{bench}/q{N}/{engine}/base/single-threaded/fused_scan.cpp
