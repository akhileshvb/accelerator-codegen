benchmark_name: tpch
display_name: TPC-H
artifact_namespace: tpch
header_prefix: tpch_q
function_prefix: accel_tpch_q
create_fn_prefix: CreateTpchQ
test_target_prefix: test_tpch_q
bench_target_prefix: benchmark_tpch_q
ctest_smoke_suffix: _smoke_test
dataset_key: tpch_sf1
scale_dataset_key: tpch_sf10
# Production benchmarking targets SF20+; pipeline does not gate on SF20 by default (see scale_factor_contract.md).
production_scale_targets: [10, 20]
db_env_var: ACCEL_TPCH_DB

write_paths:
  - accelerators/tpch/**
  - eval/tests/test_support/cross_accel_helpers.cpp
  - eval/tests/test_support/cross_accel_helpers.hpp
  - eval/bench/tpch/**

allowed_commands:
  - "^ctest -R tpch_q\\d+.*$"

post_implementation_gates:
  - correctness
  - baseline
  - profile

post_optimization_gates:
  - correctness
  - baseline
  - sf10
  - profile

post_audit_gates:
  - fairness
  - sf10

fairness:
  cardinality_constants:
    - "150000"
    - "600000"
    - "800000"
  kernel_search_paths:
    duckdb:
      - accelerators/tpch/q{N}/duckdb/base/single-threaded/kernel.cpp
      - accelerators/tpch/q{N}/duckdb/base/single-threaded/fused_scan.cpp
    postgres:
      - accelerators/tpch/q{N}/postgres/base/single-threaded/kernel.cpp
