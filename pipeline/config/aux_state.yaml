# Shared aux-state pipeline settings merged into PipelineConfig when workload_kind=aux_state.

write_paths:
  - CMakeLists.txt
  - cmake/AuxState.cmake
  - src/generated/tpch/q*/aux/**
  - src/generated/catalog/**
  - src/stateful/duckdb/duckdb_aux_table_functions.cpp
  - include/accelerator_codegen/stateful/core/query_layouts.hpp
  - config/q*_aux_cost_model.json
  - tests/single-threaded/test_q*_*.cpp
  - tests/single-threaded/test_tpch_q*_aux.cpp
  - tests/test_support/q*_aux_helpers.hpp
  - tests/test_support/cross_accel_helpers.cpp
  - tests/test_support/cross_accel_helpers.hpp
  - benchmarks/tpch/single-threaded/benchmark_q*_aux.cpp
  - benchmarks/tpch/single-threaded/tpch_arg_variants.cpp
  - benchmarks/tpch/single-threaded/tpch_arg_variants.hpp
  - benchmarks/tpch/single-threaded/benchmark_q*_hybrid_eval.cpp
  - benchmarks/tpch/single-threaded/calibrate_q*_aux_cost_model.cpp

allowed_commands:
  # Build / test (gates and agent loop)
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^touch CMakeLists\\.txt && cmake -S \\. -B build-release$"
  - "^touch CMakeLists\\.txt && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest -R (q\\d+_|tpch_q\\d+_aux|test_cross_accel|test_aux_multi_connection).*"
  - "^ctest --test-dir build-release( .*)?$"
  - "^ctest -N( .*)?$"
  - "^build-release/(tests|benchmarks)/.*"
  - "^(\\.\\/)?build-release\\/test_tpch_shared_differential( .*)?$"
  - "^ACCEL_TPCH_DB=.+ (\\.\\/)?build-release\\/test_tpch_shared_differential( .*)?$"
  - "^ACCEL_ADV_[A-Z_]+=\\S+( ACCEL_ADV_[A-Z_]+=\\S+)* (\\.\\/)?build-release\\/test_tpch_shared_differential( .*)?$"
  - "^bash scripts/run_aux_bench_sweep\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cross_accel\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_multi_connection\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cost_model_calibrate\\.sh \\d+$"

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: lineitem_only
  # Fair SF1 sweep per bench_sweep_contract.md (measured DuckDB ref + full table scans).
  bench_warmup: 10
  bench_queries: 100
  bench_ref_samples: 3
  bench_base_write_samples: 3
  skip_duckdb_ref: false

# Fast smoke sweep for development only (not comparable across scale factors).
aux_bench_sweep_fast:
  write_frequencies: [0, 10]
  suites: lineitem_only
  bench_warmup: 1
  bench_queries: 5
  bench_ref_samples: 0
  bench_base_write_samples: 0
  skip_duckdb_ref: true
  bench_scan_limit: 100000

# Per-attempt quick A/B: always 0% (read axis) plus randomly sampled write mixes
# re-drawn every attempt so agents cannot hill-climb on a single write %. Within
# one attempt, frequencies are locked for multi-sample benches. Accept/reject uses
# dual_axis_weighted = read_only^read_w * write_mix^write_w where write_mix is the
# geometric mean of all non-zero write-frequency workload_speedups.
aux_bench_sweep_optimization:
  write_frequencies: [0]
  write_mix_sample:
    enabled: true
    count: 2
    choices: [1, 5, 10]
    # Cap mixes at 10%: higher % (20–50) can hang baseline for minutes–hours when
    # aux write paths full-rebuild (seen on Q8). Agents still see a write axis.
    lock_per_attempt: true
  optimization_score_metric: dual_axis_weighted
  read_score_weight: 0.75
  write_score_weight: 0.25
  write_score_floor: 0.001
  bench_warmup: 3
  bench_queries: 10
  quick_bench_queries: 10
  quick_benchmark_samples: 2
  bench_timeout_sec: 300
  bench_ref_samples: 2
  bench_base_write_samples: 1
  skip_duckdb_ref: false

optimization:
  max_iterations: 3
  max_attempts_per_iteration: 5
  improvement_threshold_pct: 2.0
  reject_threshold_pct: 1.0
  smoke_runs: 2
  skip_confirmation: true
  skip_per_attempt_correctness: true
  two_phase_hypothesis_patch: true
  experimental_chain_cap: 3
  # Agent stops with OPTIMIZATION_SATURATED when stuck (no numeric floors).
  early_stop:
    enabled: true

post_implementation_gates:
  - aux_correctness
  - aux_unit
  - aux_cost_model_calibrate
  - aux_multi_connection
  - aux_cross_accel
  - aux_bench_sweep

# End-of-optimization-iteration gate batch (not run per attempt).
post_optimization_gates:
  - aux_correctness
  - aux_unit
  - aux_cost_model_calibrate
  - aux_multi_connection
  - aux_cross_accel
  - aux_bench_sweep

# End-of-audit hard gates: correctness + fair SF1 sweep.
# Scale-safety / harness-cheat review is agent analysis in final_audit.md
# (not brittle substring or parse-fragile speedup gates).
post_audit_gates:
  - aux_correctness
  - aux_unit
  - aux_mutation_scenarios
  - aux_bench_sweep

# Optional static fairness scan paths (agent may request_gate fairness; not a hard fail gate).
fairness:
  kernel_search_paths:
    - src/generated/tpch/q{N}/aux/module.cpp
    - src/generated/tpch/q{N}/aux/finalize.cpp
    - src/generated/tpch/q{N}/base/single-threaded/kernel.cpp

prompt_subdir: aux_state

# Aux analysis reads taxonomy + reference modules and writes a large analysis.json;
# OpenRouter/OpenAI Agents backends need more turns than base parallel queries.
stage_max_turns:
  analysis: 24
  adversarial_tests: 8
  implementation: 0  # 0 = unlimited (resolved in stages/base.py)
  optimization: 0
  crash_debug: 16
  audit: 12

optimization_max_turns_per_episode: 0

# Max times analysis may re-run after implementation/optimization finds a structural bottleneck.
max_structural_reanalysis: 2

speedup_verification:
  min_speedup_vs_base: 2.0
  min_work_reduction_pct: 50
  metric_preference:
    - wall_time
    - scanned_rows
    - operator_time
