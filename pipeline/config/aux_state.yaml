# Settings merged into every workload_kind=aux_state workload (on top of default.yaml and the
# benchmark pack); lists extend default.yaml's, a workload's own values win.

write_paths:
  - eval/bench/**/*_arg_variants.*

allowed_commands:
  # Build / test (gates and agent loop)
  - "^touch CMakeLists\\.txt && cmake -S \\. -B build-release$"
  - "^touch CMakeLists\\.txt && cmake --build build-release( .*)?$"
  - "^ctest -R (q\\d+_|tpch_q\\d+_aux|test_[a-z0-9]+_(cross_accel|aux_multi_connection)).*"
  # test / bench / calibrate binaries land in the build root (no tests/ or benchmarks/ subdir)
  - "^(\\./)?build-release/(test|benchmark|calibrate)_[A-Za-z0-9_]+( .*)?$"
  - "^(ACCEL_[A-Z_]+=\\S+ )+(\\.\\/)?build-release\\/(test|benchmark|calibrate)_[A-Za-z0-9_]+( .*)?$"
  # the engine host: harness builds and runs (host_bootstrap and the gates reach the engine only through it)
  - "^(\\./)?backends/[A-Za-z0-9_]+/host\\.sh (info|up|load|build|run|sql)( .*)?$"
  - "^bash scripts/run_aux_bench_sweep\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cross_accel\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_multi_connection\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_tsan\\.sh \\d+$"
  - "^bash pipeline/gates/run_module_tsan\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cost_model_calibrate\\.sh \\d+$"

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: lineitem_only
  # Fair SF1 sweep per bench_sweep_contract.md (measured DuckDB ref + full table scans).
  bench_warmup: 10
  bench_queries: 100
  bench_ref_samples: 3
  bench_base_write_samples: 3
  skip_duckdb_ref: false

# Per-attempt quick A/B: always 0% (read axis) plus randomly sampled write mixes
# re-drawn every attempt so agents cannot hill-climb on a single write %. Within
# one attempt, frequencies are locked for multi-sample benches. Accept/reject uses
# dual_axis_weighted = read_only^read_w * write_mix^write_w where write_mix is the
# geometric mean of all non-zero write-frequency workload_speedups.
aux_bench_sweep_optimization:
  write_frequencies: [0]
  write_mix_sample:
    enabled: true
    count: 2
    # The frequencies are drawn from the query's suite write_mix.yaml, capped here: above ~10% the
    # baseline can hang for minutes–hours when aux write paths full-rebuild (seen on Q8).
    max_pct: 10
    lock_per_attempt: true
  optimization_score_metric: dual_axis_weighted
  read_score_weight: 0.75
  write_score_weight: 0.25
  write_score_floor: 0.001
  bench_warmup: 3
  bench_queries: 10
  quick_bench_queries: 10
  quick_benchmark_samples: 2
  bench_timeout_sec: 300
  bench_ref_samples: 2
  bench_base_write_samples: 1
  skip_duckdb_ref: false

# Agent-call tier (run_quick_benchmark, run_profile): direction only, seconds per call.
# acceptance=True uses aux_bench_sweep_optimization; the full aux_bench_sweep is for stage exit.
aux_bench_sweep_quick:
  write_frequencies: [0]
  bench_warmup: 1
  bench_queries: 5
  bench_ref_samples: 1
  bench_base_write_samples: 1
  bench_timeout_sec: 120

# The stage-exit batch: the quick unit checks, then one aux_exit run (correctness at N and 1 threads, multi-connection,
# cross-accelerator, TSAN on the subset, the bench sweep and the cost-model calibration, side by side).
post_implementation_gates:
  - aux_unit
  - prims_tests
  - aux_exit

# End-of-optimization-iteration batch (not run per attempt): the lighter correctness tier.
post_optimization_gates:
  - aux_unit
  - prims_tests
  - aux_exit

# End-of-audit hard gates: the exit run and the engine-free module TSAN driver.
# Scale-safety / harness-cheat review is agent analysis in final_audit.md
# (not brittle substring or parse-fragile speedup gates).
post_audit_gates:
  - aux_unit
  - prims_tests
  - aux_exit
  - module_tsan

# Optional static fairness scan paths, {bench}/{engine} expanded for the run (agent may request_gate fairness; not a hard fail gate).
fairness:
  kernel_search_paths:
    - accelerators/{bench}/q{N}/{engine}/aux/module.cpp
    - accelerators/{bench}/q{N}/{engine}/aux/finalize.cpp
    - accelerators/{bench}/q{N}/{engine}/base/single-threaded/kernel.cpp

prompt_subdir: aux_state

# Aux analysis reads taxonomy + reference modules and writes a large analysis.json:
# more turns than a base query needs (default.yaml); 0 = unlimited.
stage_max_turns:
  analysis: 24
  analysis_critic: 16
  test_suite: 24
  implementation: 0
  crash_debug: 16
  audit: 12
  layer_critique: 20

# Independent critic rounds on the analysis (each may send it back for one revision; the next round
# re-checks that revision); 0 disables. One round names the issues; the revision fixes them.
analysis_critique_max_rounds: 1
