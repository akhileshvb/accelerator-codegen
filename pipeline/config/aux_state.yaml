# Shared aux-state pipeline settings merged into PipelineConfig when workload_kind=aux_state.

# Run policy of an aux workload; a workload's own value wins.
requires_base_accelerator: false   # aux and base accelerators are independent
prerequisite_min_stage: implementation
allow_poor_fitness: false
allow_unsuccessful_design: false

write_paths:
  # the query's own tree: module, layout, registrars (engine backends name no query)
  - accelerators/*/q*/**
  - eval/tests/test_support/**
  - eval/bench/**/*_arg_variants.*

allowed_commands:
  # Build / test (gates and agent loop)
  - "^cmake -S \\. -B build-release( .*)?$"
  - "^cmake -S \\. -B build-release && cmake --build build-release( .*)?$"
  - "^touch CMakeLists\\.txt && cmake -S \\. -B build-release$"
  - "^touch CMakeLists\\.txt && cmake --build build-release( .*)?$"
  - "^cmake --build build-release( .*)?$"
  - "^ctest -R (q\\d+_|tpch_q\\d+_aux|test_[a-z0-9]+_(cross_accel|aux_multi_connection)).*"
  - "^ctest --test-dir build-release( .*)?$"
  - "^ctest -N( .*)?$"
  # test / bench / calibrate binaries land in the build root (no tests/ or benchmarks/ subdir)
  - "^(\\./)?build-release/(test|benchmark|calibrate)_[A-Za-z0-9_]+( .*)?$"
  - "^(ACCEL_[A-Z_]+=\\S+ )+(\\.\\/)?build-release\\/(test|benchmark|calibrate)_[A-Za-z0-9_]+( .*)?$"
  # the engine host: harness builds and runs (host_bootstrap and the gates reach the engine only through it)
  - "^(\\./)?backends/[A-Za-z0-9_]+/host\\.sh (info|up|load|build|run|sql)( .*)?$"
  - "^bash scripts/run_aux_bench_sweep\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cross_accel\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_multi_connection\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_tsan\\.sh \\d+$"
  - "^bash pipeline/gates/run_module_tsan\\.sh \\d+$"
  - "^bash pipeline/gates/run_aux_cost_model_calibrate\\.sh \\d+$"

aux_bench_sweep:
  write_frequencies: [0, 1, 10, 50]
  suites: lineitem_only
  # Fair SF1 sweep per bench_sweep_contract.md (measured DuckDB ref + full table scans).
  bench_warmup: 10
  bench_queries: 100
  bench_ref_samples: 3
  bench_base_write_samples: 3
  skip_duckdb_ref: false

# Per-attempt quick A/B: always 0% (read axis) plus randomly sampled write mixes
# re-drawn every attempt so agents cannot hill-climb on a single write %. Within
# one attempt, frequencies are locked for multi-sample benches. Accept/reject uses
# dual_axis_weighted = read_only^read_w * write_mix^write_w where write_mix is the
# geometric mean of all non-zero write-frequency workload_speedups.
aux_bench_sweep_optimization:
  write_frequencies: [0]
  write_mix_sample:
    enabled: true
    count: 2
    # The frequencies are drawn from the query's suite write_mix.yaml, capped here: above ~10% the
    # baseline can hang for minutes–hours when aux write paths full-rebuild (seen on Q8).
    max_pct: 10
    lock_per_attempt: true
  optimization_score_metric: dual_axis_weighted
  read_score_weight: 0.75
  write_score_weight: 0.25
  write_score_floor: 0.001
  bench_warmup: 3
  bench_queries: 10
  quick_bench_queries: 10
  quick_benchmark_samples: 2
  bench_timeout_sec: 300
  bench_ref_samples: 2
  bench_base_write_samples: 1
  skip_duckdb_ref: false

# Agent-call tier (run_quick_benchmark, run_profile): direction only, seconds per call.
# acceptance=True uses aux_bench_sweep_optimization; the full aux_bench_sweep is for stage exit.
aux_bench_sweep_quick:
  write_frequencies: [0]
  bench_warmup: 1
  bench_queries: 5
  bench_ref_samples: 1
  bench_base_write_samples: 1
  bench_timeout_sec: 120

optimization:
  max_iterations: 3
  max_attempts_per_iteration: 5
  improvement_threshold_pct: 2.0
  reject_threshold_pct: 1.0
  smoke_runs: 2
  # OPTIMIZATION_SATURATED is honored only once the read speedup over the stateless base kernel
  # reaches the floor, or the last `saturation_required_attempts` trials were profile-guided and
  # distinct, with one structural and one low-level change among them.
  early_stop:
    enabled: true
    saturation_min_read_speedup: 20
    saturation_required_attempts: 3
  # A redesign of the state (declared as strategy=structural, or inferred from the changed lines)
  # is kept only after the full tier of these gates and a measured read gain with the write axis held.
  structural:
    gates: [aux_correctness, aux_unit, aux_tsan, aux_multi_connection]
    inferred_diff_fraction: 0.35

post_implementation_gates:
  - aux_correctness
  - aux_unit
  - prims_tests
  - aux_cost_model_calibrate
  - aux_multi_connection
  - aux_cross_accel
  - aux_bench_sweep

# End-of-optimization-iteration gate batch (not run per attempt).
post_optimization_gates:
  - aux_correctness_iterate
  - aux_unit
  - prims_tests
  - aux_cost_model_calibrate
  - aux_multi_connection
  - aux_cross_accel
  - aux_bench_sweep

# End-of-audit hard gates: correctness + fair SF1 sweep.
# Scale-safety / harness-cheat review is agent analysis in final_audit.md
# (not brittle substring or parse-fragile speedup gates).
post_audit_gates:
  - aux_correctness
  - aux_unit
  - prims_tests
  - aux_tsan
  - module_tsan
  - aux_bench_sweep

# Optional static fairness scan paths, {bench}/{engine} expanded for the run (agent may request_gate fairness; not a hard fail gate).
fairness:
  kernel_search_paths:
    - accelerators/{bench}/q{N}/{engine}/aux/module.cpp
    - accelerators/{bench}/q{N}/{engine}/aux/finalize.cpp
    - accelerators/{bench}/q{N}/{engine}/base/single-threaded/kernel.cpp

prompt_subdir: aux_state

# Aux analysis reads taxonomy + reference modules and writes a large analysis.json;
# Aux analysis needs more turns than base parallel queries.
stage_max_turns:
  analysis: 24
  analysis_critic: 16
  test_suite: 24
  implementation: 0  # 0 = unlimited (resolved in stages/base.py)
  optimization: 0
  crash_debug: 16
  audit: 12
  host_bootstrap: 0
  layer_critique: 20

# Post-stage host_bootstrap gate: on fail, re-invoke the agent with notes/log_tail.
host_bootstrap_gate_max_rounds: 3
# Cheap critic after a green bootstrap gate; 0 disables.
host_bootstrap_critique_max_rounds: 2

# Independent critic rounds on the analysis (each may send it back for one revision; the next round
# re-checks that revision); 0 disables.
analysis_critique_max_rounds: 2

# Max times analysis may re-run after implementation/optimization finds a structural bottleneck.
max_structural_reanalysis: 2

speedup_verification:
  min_speedup_vs_base: 2.0
  min_work_reduction_pct: 50
