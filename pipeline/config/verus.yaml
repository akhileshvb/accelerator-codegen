# Verus accelerator pipeline (--mode verus) defaults.  A workload's `verus:`
# section overrides any key.  Every agent step runs on codex exec
# (stage_providers verus_* in models.yaml).

# Names (defaults derived from the benchmark and query):
#   crate: tpch_q21_vgen          kernel crate accelerators/<bench>/q<N>/verus_kit/<crate>/crate, C ABI <crate>_verus.h
#   accelerator_id: tpch_q21_vgen table function accel_<id>
#   ffi_prefix: tpchq21vgen       C names <prefix>_* / <prefix>s_*
#   query_sql: workloads/<bench>/q<N>.sql   the query with $n parameters
#   schema_sql: workloads/<bench>/schema.sql
# test_db / bench_db: the `<bench>_test` / `<bench>_sf1` datasets of default.yaml (ACCEL_TPCH_TEST_DB, ACCEL_TPCH_DB);
# correctness gates and optimization A/B work on per-run copies.
# build_dir: build-release      # CMake build dir with the DuckDB engine (default: the pipeline's)
# lib_dir: build-verus          # kernel static libraries
# verus_bin: <tree>/tools/verus/verus-x86-linux/verus   (or env VERUS_BIN)
# The agents' OS sandbox (accel_pipeline/verus/actions.py, sandbox section): each codex step and
# its MCP server see only this tree, the DuckDB checkout, toolchains and codex.
# Preflight probes it and stops if anything else of $HOME is visible.
# `none` runs codex unsandboxed (approvals are bypassed either way).
sandbox: bwrap
engine: duckdb                  # the engine the accelerator runs on: the spec models its semantics (sql2verus --engine)
agent_retries: 2                # an agent step failing on a provider hiccup (429/5xx, dropped stream) is retried
# Independent stages run concurrently: the spec audit with the analysis; after
# freeze B, the obligations audit, the tests and the glue.  false: one at a time.
parallel_stages: true
# sql2verus's cargo build dir, shared across trees (default ~/.cache/accel_verus/cargo-target)
# cargo_target_dir: ...

stages:
  reuse_spec_audit: true        # skip it when an accepted audit of the same SQL + schema + spec exists
  analysis_revisions: 2         # critic -> analysis revision rounds (analysis revises in its own session)
  adversarial_revisions: 2      # strengthen rounds when the fault self-check misses a bug
  kernel_fix_rounds: 4          # per kernel phase (code, then proofs): the failure goes back to the kernel agent's session
  escalate_after_stalled_rounds: 2  # fix rounds in a row without progress -> a second opinion from
                                    # verus_kernel_advisor (models config: verus_advisor), fed back to the session
  escalation_extra_rounds: 2    # rounds added with the advice
  glue_fix_rounds: 3            # glue fix rounds (build, contract check, glue audit)

gates:
  max_fallback_rate: 0.0        # answered with SQL / all accelerator queries: inside the envelope any fallback is a bug
  snapshot_writes: 200
  snapshot_readers: 4
  differential_every: 10        # all parameter tuples every N transactions
  random_param_sets: 6          # fresh random domain tuples added to every differential / snapshots run
  frozen_param_sets: 8          # random domain tuples appended to tests/params.sql when the tests are frozen

# Query parameters: every substitution parameter is a runtime $n parameter.  Benchmarks, profiles and the
# gates draw random tuples from the TPC-H domain (eval/compare/gen_tpch_params.py) with a new random
# seed per run, recorded in <artifacts>/param_draws/; a paired comparison shares one draw.
params:
  sets: 5                       # tuples per benchmark / profile draw
  # generator: eval/compare/gen_tpch_params.py
  # seed: 1                     # tests only: pins the draw (a run never sets it)

# Optimization loop (Verus global store: ACCEL_AUX_STORE=verus_global).  Hard ceilings always reach the audit;
# the progress stop is the usual exit; it may fire only after a minimum of
# profile-guided exploration.
optimization:
  max_concurrent: 4             # machine-wide: pipelines optimizing at once (their benchmarks take turns);
                                # the others wait before the stage, their budget not running
  stage_budget_sec: 1800        # whole loop (30 min); then the best kernel goes to the audit
  attempt_timeout_sec: 2700     # one attempt's agent run
  attempt_gate_fix_rounds: 2    # verify / test fix rounds inside an attempt
  patience: 4                   # consecutive attempts without an accepted improvement
  diminishing_window: 3         # the last M accepts ...
  diminishing_min_gain_pct: 5.0 # ... must gain at least X% together
  min_attempts: 3
  hotspot_share: 0.10           # profile hotspots at or above this share need an attempt
  max_structural_moves: 2       # aux-state family changes (inputs re-freeze)
  min_improvement_pct: 2.0      # accept threshold on the paired median gain
  proof_cost_weight: 0.0        # score penalty per doubling of verification time
  bench:
    reps: 5
    ops: 200
    target_sec: 180               # benches scaled down (once per run, by a 10-op probe) to about this long
    write_mix_choices: [0.01, 0.05, 0.1]
    write_mix_count: 2
    paired_rounds: 3            # acceptance: best and candidate benched alternately, medians compared
    read_score_weight: 0.75
    write_score_weight: 0.25

# A kernel that passes its tests is measured briefly on SF1 (code first, and again once proved): the tests'
# database is too small to show per-write copies of the state or whole-state scans per read.
cost_check:
  enabled: true
  ops: 20                       # operations per run (1 rep, one write mix)
  write_mix: 0.05
  min_read_speedup: 2.0         # reads vs the plain query
  min_mix_speedup: 1.0          # the write mix vs the plain query: never slower than without the accelerator
  timeout_sec: 240              # not finishing in time fails the check (work grows with the whole state)
  max_write_overhead_ratio: 10  # the maintenance a write adds, at most this times the plain write ...
  write_overhead_floor_us: 5000 # ... or this much, whichever is larger
