# First accelerators on a regenerated DuckDB backend: TPC-H Q1 and Q6 (each base accelerator
# first), two at a time, before the full tpch_regen_all22 pack.

pack_id: tpch_duckdb_q1_q6
display_name: TPC-H Q1 + Q6 on DuckDB
engines: [duckdb]
concurrency: 2
stage: all
resume: true
models_config: pipeline/config/models.yaml

workload_template: "tpch_q{q}_aux"

queries: [1, 6]

isolation:
  mode: shared_tree_separate_builds
  build_dir_template: "build-release-{worker_id}"
  codex_home_template: "pipeline/.codex/workers/{worker_id}"
  shared_file_lease: true
  stage_barriers: false
