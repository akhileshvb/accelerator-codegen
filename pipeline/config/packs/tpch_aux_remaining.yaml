# Remaining TPC-H aux queries — optimization fan-out after implementation gates.
# Per-worker git worktrees + separate builds + shared-file lease. No stage barriers.
# Q4 is excluded (already run / handled separately). Fresh start: resume false +
# cleared scoreboards so phantom half-run numbers do not poison A/B.

pack_id: tpch_aux_remaining
display_name: TPC-H aux remaining optimization (Q7/Q8/Q13/Q15/Q19/Q20/Q22)
concurrency: 7
stage: optimization
resume: false
models_config: pipeline/config/models.yaml

workload_template: "tpch_q{q}_aux"

queries:
  - { query: 7, workload: tpch_q7_aux }
  - { query: 8, workload: tpch_q8_aux }
  - { query: 13, workload: tpch_q13_aux }
  - { query: 15, workload: tpch_q15_aux }
  - { query: 19, workload: tpch_q19_aux }
  - { query: 20, workload: tpch_q20_aux }
  - { query: 22, workload: tpch_q22_aux }

isolation:
  mode: worktree  # per-worker git worktree — no shared-source compile crosstalk
  build_dir_template: "build-release-{worker_id}"
  codex_home_template: "pipeline/.codex/workers/{worker_id}"
  shared_file_lease: true
  stage_barriers: false
