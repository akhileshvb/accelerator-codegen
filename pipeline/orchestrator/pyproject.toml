[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accel-pipeline"
version = "0.1.0"
description = "Agent pipeline orchestrator for accelerator-codegen"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "duckdb>=1.0.0",
]

[project.scripts]
accel-pipeline = "accel_pipeline.run_pipeline:main"
accel-pipeline-pack = "accel_pipeline.run_pack:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["accel_pipeline*"]
