[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accel-pipeline"
version = "0.1.0"
description = "Agent pipeline orchestrator for accelerator-codegen"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "sqlglot>=25.0",
  "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
accel-pipeline = "accel_pipeline.run_pipeline:main"
accel-pipeline-pack = "accel_pipeline.pack.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["accel_pipeline*"]

[tool.pytest.ini_options]
markers = ["pipeline_smoke: builds a clean tree and runs the whole pipeline with a scripted agent (minutes; opt in with ACCEL_RUN_PIPELINE_SMOKE=1)"]
