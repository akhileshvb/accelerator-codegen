[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accel-pipeline"
version = "0.1.0"
description = "Agent pipeline orchestrator for accelerator-codegen"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.1.0",
  "openai>=1.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
cursor = [
  "cursor-sdk>=1.0.26",
]
openrouter = [
  "openai-agents>=0.1.0",
  "litellm>=1.0.0",
]
dev = [
  "pytest>=8.0",
  "duckdb>=1.0.0",
]
all = [
  "cursor-sdk>=1.0.26",
  "litellm>=1.0.0",
  "pytest>=8.0",
]

[project.scripts]
accel-pipeline = "accel_pipeline.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["accel_pipeline*"]
