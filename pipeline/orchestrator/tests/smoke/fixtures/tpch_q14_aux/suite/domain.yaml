# The domain every run draws fresh random tuples from (accel_pipeline.test_suite.draw_tuples):
# 20 tuples in the full tier, 4 in quick, 12 in the stage's validation.
# $1 is the query's only real parameter; $2 is the end date it derives (type: derived), so every draw
# keeps $2 = $1 + 1 month the way DuckDB's `DATE + INTERVAL '1' month` does (the day clamped to the
# target month's last day, e.g. 1995-01-31 -> 1995-02-28).
#
# The range is strictly wider than the benchmark generator's own set (first of a month, 1993-01 ..
# 1997-12): it reaches the first and last data days (1992-01-02, 1998-12-01), the mid-month days, the
# month ends, the leap days and the months that hold no lineitem at all (empty / NULL answer), so a
# kernel keyed to any fixed start date or to a month-aligned window fails. The extreme DATEs
# (0001-01-01, 9999-11-30) stay in params.sql instead, where a derived end date is written by hand:
# a random draw must keep its own derived end date representable too.
version: 1
params:
  - {name: start_date, type: choice, values: ["DATE '1992-01-01'", "DATE '1992-02-01'", "DATE '1992-03-01'", "DATE '1992-04-01'", "DATE '1992-05-01'", "DATE '1992-06-01'", "DATE '1992-07-01'", "DATE '1992-08-01'", "DATE '1992-09-01'", "DATE '1992-10-01'", "DATE '1992-11-01'", "DATE '1992-12-01'", "DATE '1993-01-01'", "DATE '1993-02-01'", "DATE '1993-03-01'", "DATE '1993-04-01'", "DATE '1993-05-01'", "DATE '1993-06-01'", "DATE '1993-07-01'", "DATE '1993-08-01'", "DATE '1993-09-01'", "DATE '1993-10-01'", "DATE '1993-11-01'", "DATE '1993-12-01'", "DATE '1994-01-01'", "DATE '1994-02-01'", "DATE '1994-03-01'", "DATE '1994-04-01'", "DATE '1994-05-01'", "DATE '1994-06-01'", "DATE '1994-07-01'", "DATE '1994-08-01'", "DATE '1994-09-01'", "DATE '1994-10-01'", "DATE '1994-11-01'", "DATE '1994-12-01'", "DATE '1995-01-01'", "DATE '1995-02-01'", "DATE '1995-03-01'", "DATE '1995-04-01'", "DATE '1995-05-01'", "DATE '1995-06-01'", "DATE '1995-07-01'", "DATE '1995-08-01'", "DATE '1995-09-01'", "DATE '1995-10-01'", "DATE '1995-11-01'", "DATE '1995-12-01'", "DATE '1996-01-01'", "DATE '1996-02-01'", "DATE '1996-03-01'", "DATE '1996-04-01'", "DATE '1996-05-01'", "DATE '1996-06-01'", "DATE '1996-07-01'", "DATE '1996-08-01'", "DATE '1996-09-01'", "DATE '1996-10-01'", "DATE '1996-11-01'", "DATE '1996-12-01'", "DATE '1997-01-01'", "DATE '1997-02-01'", "DATE '1997-03-01'", "DATE '1997-04-01'", "DATE '1997-05-01'", "DATE '1997-06-01'", "DATE '1997-07-01'", "DATE '1997-08-01'", "DATE '1997-09-01'", "DATE '1997-10-01'", "DATE '1997-11-01'", "DATE '1997-12-01'", "DATE '1998-01-01'", "DATE '1998-02-01'", "DATE '1998-03-01'", "DATE '1998-04-01'", "DATE '1998-05-01'", "DATE '1998-06-01'", "DATE '1998-07-01'", "DATE '1998-08-01'", "DATE '1998-09-01'", "DATE '1998-10-01'", "DATE '1998-11-01'", "DATE '1998-12-01'"]}
