# Smoke-test suite of the scripted agent: the query's reference parameter tuples and transactions with a manifest
# that declares them. (The files are data of the smoke test, not a model's work.)
version: 1
query: 14
rationale: >
  Q14 is a scalar ratio over lineitem joined to part for one date window. The tuples walk month-aligned windows,
  month windows (the reference accelerator takes a start date and covers one month); the transactions write both dependent
  tables with point and bulk inserts, updates and deletes, duplicate join keys and a key move.
edge_coverage:
  in_spec: [1, 2, 3, 4, 5]
  off_spec: [6, 7]
  null_param: "n/a: the smoke suite carries no NULL window (the real suites do)"
  empty_result: "n/a: a scalar aggregate always returns one row"
  limit_ties: "n/a: the query has no ORDER BY and no LIMIT"
  extreme_values: [8]
  large_keys: "n/a: the only parameter is a DATE"
txns:
  "001.sql": {kind: point_update}
  "002.sql": {kind: point_update}
  "003.sql": {kind: point_update}
  "004.sql": {kind: point_update}
  "005.sql": {kind: point_update}
  "006.sql": {kind: point_update}
  "007.sql": {kind: point_insert}
  "008.sql": {kind: point_update}
  "009.sql": {kind: point_delete}
  "010.sql": {kind: point_insert}
  "011.sql": {kind: point_update}
  "012.sql": {kind: point_update}
  "013.sql": {kind: point_delete}
  "014.sql": {kind: bulk_update}
  "015.sql": {kind: bulk_update}
  "016.sql": {kind: bulk_update}
  "017.sql": {kind: bulk_update}
  "018.sql": {kind: bulk_insert}
  "019.sql": {kind: bulk_update}
  "020.sql": {kind: bulk_delete}
  "021.sql": {kind: point_insert}
  "022.sql": {kind: bulk_delete}
  "023.sql": {kind: bulk_update}
  "024.sql": {kind: bulk_update}
  "025.sql": {kind: point_insert}
  "026.sql": {kind: point_update}
  "027.sql": {kind: key_move}
  "028.sql": {kind: point_update}
  "029.sql": {kind: point_delete}
  "030.sql": {kind: point_insert}
  "031.sql": {kind: bulk_insert}
  "032.sql": {kind: sequence}
not_applicable:
  rollback: "the smoke suite applies committed transactions only"
point_writes: {min_count: 3, max_probes: 8, tables: [lineitem, part]}
bulk_writes: {required: true, min_chunks: 2}
scale_scenarios:
  - "The smoke suite runs at the test scale only; the scale classes are exercised by the real suites"
